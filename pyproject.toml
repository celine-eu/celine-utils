[project]
name = "celine-utils"
version = "2.0.1"
description = "CELINE utils"
readme = "README.md"
requires-python = ">=3.10"

# The supported range, proven rather than assumed: `test.yml` builds its matrix
# from these classifiers, so a version listed here is a version CI runs.
#
# The floor was `>=3.12` and the core never needed it — `pydantic`, `pyyaml` and
# `jsonschema` resolve as low as 3.9. It came in entirely through one extras-only
# dependency, `celine-sdk`, which declared 3.12 without requiring it. So a
# consumer wanting nothing but `celine.governance` paid a floor set by an
# orchestration dependency it never installed, and `celine-superset` — which
# ships inside `apache/superset:6.0.0`, Python 3.10 — could not adopt this
# package at all.
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core = what `celine.governance` needs, and nothing else.
#
# This package used to require dbt, Meltano, Prefect and Keycloak in order to
# parse a YAML file. That is why `dataset-api`, `ds` and `celine-superset` each
# wrote their own governance parser rather than import this one — no API service
# could take an orchestration stack as a dependency — and why the four then
# disagreed about what the same file meant.
#
# Keeping this list short is therefore load-bearing, not tidiness. The
# `governance-thin` CI job installs with no extras and imports
# `celine.governance`; if anything below grows, that job is what says so.
dependencies = [
    "pydantic>=2.11.7",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Pipeline execution: dbt/Meltano/Prefect orchestration and lineage emission.
pipelines = [
    "openlineage-python>=1.37.0",
    "pandas>=2.3.2",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "typer>=0.16.1",
    "dbt-core>=1.10.10",
    "dbt-postgres>=1.9.1",
    "prefect-dbt>=0.7.6",
    "meltano>=4.2.0",
    "prefect>=3.6.26",
    # >=1.15.0, not >=1.13.0: 1.15.0 is the first release supporting the Python
    # range this package now declares. Under the looser pin uv forks the
    # resolution — 1.13.0 on 3.12+, 1.15.0 below — so the interpreter would
    # decide which SDK you get. This is the dependency that held the platform at
    # 3.12; the floor has to move with it.
    "celine-sdk>=1.15.0",
]
# Just the attrs GovernanceDatasetFacet class. `celine.governance.build_facet`
# returns a plain dict and needs none of this.
openlineage = [
    "openlineage-python>=1.37.0",
]
# Keycloak / Superset administration.
admin = [
    "bcrypt>=4.3.0",
    "python-keycloak>=5.8.1",
    "requests>=2.32.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    # >=1.15.0, not >=1.13.0: 1.15.0 is the first release supporting the Python
    # range this package now declares. Under the looser pin uv forks the
    # resolution — 1.13.0 on 3.12+, 1.15.0 below — so the interpreter would
    # decide which SDK you get. This is the dependency that held the platform at
    # 3.12; the floor has to move with it.
    "celine-sdk>=1.15.0",
]
# Everything — the pre-1.19 dependency set. Existing consumers move to this.
all = [
    "celine-utils[pipelines,openlineage,admin]",
]

[dependency-groups]
# `test` is what the CI matrix installs and must work on every supported
# version; `dev` adds release tooling that only runs on a maintainer's machine.
# Keeping them apart stops a tool's own floor from dictating the package's — in
# `celine-sdk` an undifferentiated group did exactly that.
test = [
    "pytest>=8.4.2",
]
dev = [
    { include-group = "test" },
    "debugpy>=1.8.16",
    "python-semantic-release>=10.5.3; python_version >= '3.11'",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
celine-utils = "celine.utils.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
# `celine.governance*` ships from this wheel today and is expected to become its
# own distribution. Omitting it here produces a wheel that imports fine from a
# source checkout and fails only at a consumer's install — so it is listed
# explicitly rather than left to a glob.
include = ["celine.utils*", "celine.governance*"]

# The JSON Schemas live at `./schema/` in the repo root and MUST STAY THERE:
# the documentation site serves that directory directly, via the `links` block
# for this repo in `celine-eu.github.io/repos.yaml`. Moving them breaks
# https://celine-eu.github.io/schema/GovernanceDatasetFacet.schema.json — the
# `_schemaURL` embedded in every OpenLineage event already emitted.
#
# They are also runtime artifacts now that `celine.governance.validation`
# executes them, and `importlib.resources` can only read files inside a package.
# `src/celine/governance/schema` is therefore a **symlink** to `../../../schema`:
# one authoritative copy, reachable both ways. Do not "tidy" it into a real
# directory — that recreates the duplicate the symlink exists to avoid.
[tool.setuptools.package-data]
"celine.governance.schema" = ["*.json"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.uv]
override-dependencies = ["click>=8.2,<8.4"]

