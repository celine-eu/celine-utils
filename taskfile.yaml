version: "3"

# A task that would have to name a private checkout to be useful lives in
# taskfile.local.yaml, which is gitignored and optional: this file works without
# it. `graph:all` — the dependency graph across the open-source pipelines and a
# deployment's — is the one that needs it. Same arrangement as celine-policies
# and celine-dashboards.
includes:
  local:
    taskfile: taskfile.local.yaml
    optional: true
    flatten: true

tasks:
  setup:
    desc: Setup environment
    cmds:
      - uv sync --all-extras

  test:
    desc: Run the fast unit suite (no docker)
    cmds:
      - uv run pytest tests/ {{.CLI_ARGS}}

  test:thin:
    desc: Prove celine.governance imports and resolves on core deps alone
    summary: |
      Mirrors the governance-thin CI job, which is the boundary that keeps
      celine.governance shareable. celine-utils once required dbt, Meltano,
      Prefect and Keycloak to parse a YAML file — which is why dataset-api, ds
      and celine-superset each wrote their own parser instead of importing this
      one, and why the four then disagreed about what the same file meant.
    cmds:
      - rm -rf .venv-thin
      - uv venv .venv-thin
      - uv pip install --python .venv-thin/bin/python . pytest
      - .venv-thin/bin/python -m pytest tests/ -q

  cli:
    desc: Run the celine-utils CLI from the working tree
    summary: |
      `celine.utils.cli`, not `celine.cli` — the package moved when governance
      was split out and this task kept the old path, so it raised
      ModuleNotFoundError for every argument it was given.
    cmds:
      - cmd: uv run -m celine.utils.cli.main {{.CLI_ARGS}}
        silent: true

  cli-dbg:
    desc: Run the CLI under debugpy
    cmds:
      - task: clean-pycache
      - cmd: DEBUGGER=1 DEBUGGER_WAIT=0 uv run -m celine.utils.cli.main {{.CLI_ARGS}}

  graph:
    desc: Dependency graph of the open-source pipelines
    summary: |
      Resolves each app's `depends_on` against every app's `sources`, and prints
      the tiers plus anything inconsistent. Sibling checkout, so this works from
      any clone with the workspace layout; override with PIPELINES=<glob>.

      The deployment's pipelines are not in this scan and their datasets show up
      under "satisfied outside this scan". `graph:all` includes them and lives in
      taskfile.local.yaml, because that path may not be committed.
    vars:
      PIPELINES: '{{.PIPELINES | default "../celine-pipelines/apps/*"}}'
    cmds:
      - uv run -m celine.utils.cli.main governance graph '{{.PIPELINES}}' {{.CLI_ARGS}}

  clean-pycache:
    cmds:
      - find . -type d -name "__pycache__" -exec rm -r {} +

  integration-tests:
    desc: Run integration tests
    cmds:
      - cd integration-tests && task run -- {{.CLI_ARGS}}

  release:
    desc: Cut a release — see .agents/playbooks/release.md
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
