name: governance thin core

# This job is the boundary.
#
# `celine.governance` exists because `celine-utils` used to require dbt, Meltano,
# Prefect and Keycloak in order to parse a YAML file — so `dataset-api`, `ds` and
# `celine-superset` each wrote their own parser rather than take that dependency,
# and the four then disagreed about what the same file meant.
#
# Extras gate that weight, but nothing in a single repository *enforces* the
# separation: adding `import sqlalchemy` to a governance module is one line, and
# a developer environment has every extra installed, so review is the only thing
# standing in the way. This job installs the package with **no extras** and
# exercises it. If the core regains a dependency, this fails here rather than at
# a downstream consumer's install.
#
# It also guards the move: `celine.governance` is shipped from the `celine-utils`
# wheel today and is expected to become its own distribution. Staying importable
# on core dependencies alone is what keeps that a directory rename.

on:
  push:
    branches: [main]
    paths:
      - "src/celine/governance/**"
      # The JSON Schemas are tracked at the repo root and reach the package
      # through the `src/celine/governance/schema` symlink, so a schema edit
      # does **not** match the pattern above. `validation.py` executes them —
      # without this line a broken schema ships untested.
      - "schema/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/governance-thin.yaml"
  pull_request:
    paths:
      - "src/celine/governance/**"
      - "schema/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/governance-thin.yaml"

jobs:
  thin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install with no extras
        run: |
          # `--clear`: `setup-uv` creates `.venv` itself when handed a
          # `python-version` (v5 does, v7 does not), and a bare `uv venv` aborts
          # on an existing one — which is exactly how this job failed on the
          # 2.0.0 release while every other workflow passed. The guard must not
          # depend on which version of the action made the environment.
          uv venv --clear
          uv pip install .          # core dependencies only — no [pipelines], no [all]
          uv pip install pytest

      - name: Assert the heavy stack is absent
        run: |
          uv pip list --format=freeze | tee /tmp/installed.txt
          if grep -Eiq '^(sqlalchemy|prefect|meltano|dbt-core|dbt-postgres|openlineage-python|python-keycloak|pandas)==' /tmp/installed.txt; then
            echo "::error::a heavy dependency reached the core install"
            exit 1
          fi

      # `.venv/bin/python`, not `uv run`. `uv run` syncs the environment from
      # `uv.lock` — including the dev group — before it runs anything, so it
      # silently replaces the no-extras install built above. The step that
      # asserts what is present would then be checking a different environment
      # from the one the assertions run in, and a core dependency accidentally
      # declared only in the dev group would pass here and fail on a real thin
      # install. Observed: the 2.0.0 CI run downloaded `debugpy` at this step.
      - name: Import and resolve on core dependencies alone
        run: |
          .venv/bin/python -c "
          from celine.governance import GovernanceResolver, validate, build_facet
          raw = {
              'defaults': {'access_level': 'internal', 'dataspace': {'expose': True}},
              'sources': {'ds.gold.x': {'dataspace': {'expose': False}}},
          }
          validate(raw)
          rule = GovernanceResolver.from_dict(raw).resolve('ds.gold.x')
          assert rule.dataspace.expose is False, 'exclude_unset merge regressed'
          assert build_facet(rule, producer='ci')['accessLevel'] == 'internal'
          print('thin core OK')
          "

      - name: Run the governance suite
        run: .venv/bin/python -m pytest tests/ -q
