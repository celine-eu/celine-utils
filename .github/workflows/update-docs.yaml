name: Update CELINE docs

on:
    push:
        branches: [main]
        paths:
            - "README.md"
            - "docs/**"
            - "ontologies/**"
            # `celine-eu.github.io/repos.yaml` publishes this repo's `schema/`
            # directory to https://celine-eu.github.io/schema/ — the `_schemaURL`
            # embedded in every OpenLineage event already in Marquez. Without
            # this line the published copy silently drifts from the source.
            - "schema/**"

jobs:
    notify:
        runs-on: ubuntu-latest

        steps:
            - name: Trigger website rebuild
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.CELINE_WEBSITE_TOKEN }}
                  repository: celine-eu/celine-eu.github.io
                  event-type: celine-docs-update
                  client-payload: |
                      {
                        "source_repo": "${{ github.repository }}",
                        "ref": "${{ github.ref }}",
                        "sha": "${{ github.sha }}"
                      }
