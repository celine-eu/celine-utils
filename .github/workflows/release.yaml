name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write # Needed to upload artifacts to the release
  id-token: write # Needed for OIDC PyPI publishing

jobs:
  build:
    name: Build Wheel and SDist
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.baipp.outputs.package_name }}
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    ## TODO: optionally provide the name of the environment for the trusted
    ## publisher on PyPI
    ## https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment
    # environment:
    #   name: pypi
    #   url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Publish
        ## TODO: create a trusted publisher on PyPI
        ## https://docs.pypi.org/trusted-publishers/
        # v1.14.2 bundles Twine 7, the first that accepts core metadata 2.5.
        # Hatchling emits 2.5 now, and every earlier pin here fails the upload
        # with `InvalidDistribution: '2.5' is not a valid metadata version` —
        # after the tag, the changelog and the GitHub release have all
        # succeeded. It stopped two celine-ontologies releases silently.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
